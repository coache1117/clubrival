<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Club Rival · CR047</title>
<link rel="manifest" href="site.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#050506;--s1:#101014;--s2:#1b1b21;--ln:#26262e;--tx:#f5f5f7;--mut:#8d8d98;--red:#ff2a3d;--org:#ff8a1f;--yel:#ffd21a;--grn:#34c759;--rb:linear-gradient(90deg,#ff2a3d,#ff8a1f,#ffd21a,#34c759)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--tx);font:500 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body::before{content:'';position:fixed;inset:0 0 auto 0;height:420px;pointer-events:none;background:radial-gradient(60% 55% at 50% 0%,rgba(255,60,50,.16),rgba(255,160,40,.05) 45%,transparent 72%)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}a{color:inherit;text-decoration:none}
/* CR016 - the clock and battery sat on top of the logo when you scrolled. A solid strip now sits under the phone's status bar. */
#sbar{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#060607;z-index:25;pointer-events:none}
main{position:relative;max-width:940px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 44px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}.brand>div{min-width:0}.brand img{width:52px;height:52px;border-radius:15px;box-shadow:0 0 26px rgba(255,90,40,.35),0 0 0 1px rgba(255,255,255,.08)}
.logo{white-space:nowrap;font:900 italic 28px/1 -apple-system,sans-serif;letter-spacing:.01em}.logo b{background:var(--rb);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:3px}
.ver{overflow:hidden;text-overflow:ellipsis;margin-top:6px;font:800 8.5px/1 -apple-system,sans-serif;letter-spacing:.2em;color:var(--mut);white-space:nowrap}
.pill{white-space:nowrap;flex:none;max-width:34vw;overflow:hidden;text-overflow:ellipsis;padding:11px 15px;border-radius:999px;border:1px solid var(--ln);background:rgba(16,16,20,.8);backdrop-filter:blur(8px);font:900 10.5px/1 -apple-system,sans-serif;letter-spacing:.12em}
/* level */
.lv{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;border-radius:24px;margin-bottom:6px;background:linear-gradient(135deg,rgba(28,28,34,.92),rgba(12,12,15,.92));border:1px solid var(--ln);box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.ring{--p:0;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from -90deg,#ff2a3d,#ff8a1f,#ffd21a,#34c759 calc(var(--p)*1%),#22222a 0);box-shadow:0 0 30px rgba(255,120,40,.25)}
.ring>div{width:74px;height:74px;border-radius:50%;background:#08080a;display:grid;place-items:center;text-align:center}.ring b{display:block;font:900 italic 30px/1 -apple-system,sans-serif}.ring span{display:block;margin-top:3px;font:900 8px/1 -apple-system,sans-serif;letter-spacing:.22em;color:var(--mut)}
.lvt{font:900 11px/1.3 -apple-system,sans-serif;letter-spacing:.13em;color:var(--mut)}.lvt b{color:var(--tx)}
.bar{height:8px;border-radius:9px;background:var(--s2);overflow:hidden;margin:9px 0 11px}.bar i{display:block;height:100%;border-radius:9px;background:var(--rb);transition:width .7s cubic-bezier(.2,.9,.3,1)}
.xp2{display:flex;gap:22px}.xp2 span{display:block;font:900 8.5px/1 -apple-system,sans-serif;letter-spacing:.18em;color:var(--mut)}.xp2 b{display:block;margin-top:5px;font:900 italic 21px/1 -apple-system,sans-serif}
/* categories + cards */
.cat{margin:26px 2px 12px;display:flex;align-items:center;gap:12px;font:900 12px/1 -apple-system,sans-serif;letter-spacing:.26em}.cat::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.app{--ac:#fff;position:relative;display:block;aspect-ratio:1/1.16;border-radius:26px;overflow:hidden;background:#000;text-align:left;box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);transition:transform .14s,box-shadow .2s;animation:rise .5s both}
.app:nth-child(2){animation-delay:.05s}.app:nth-child(3){animation-delay:.1s}.app:nth-child(4){animation-delay:.15s}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.app img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.app::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 48%,rgba(0,0,0,.9) 100%);pointer-events:none}
.app:active{transform:scale(.965)}.app.open:active,.app.need:active{box-shadow:0 0 0 2px var(--ac),0 0 34px color-mix(in srgb,var(--ac) 55%,transparent)}
@media(hover:hover){.app.open:hover,.app.need:hover{box-shadow:0 0 0 2px var(--ac),0 0 34px color-mix(in srgb,var(--ac) 45%,transparent)}}
.app .st{position:absolute;top:11px;left:11px;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font:900 8.5px/1 -apple-system,sans-serif;letter-spacing:.16em;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1)}
.st i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}.st.open{color:var(--grn)}.st.need{color:var(--yel)}.st.soon{color:#b9b9c4}
.app .tx{position:absolute;left:13px;right:13px;bottom:13px;z-index:2}.app .tx b{display:block;font:900 italic 19px/1.02 -apple-system,sans-serif;text-shadow:0 2px 12px rgba(0,0,0,.9)}.app .tx span{display:block;margin-top:5px;font:700 11.5px/1.28 -apple-system,sans-serif;color:rgba(255,255,255,.78);text-shadow:0 1px 8px rgba(0,0,0,.9)}
.app .tx u{display:block;width:26px;height:3px;border-radius:3px;background:var(--ac);margin-bottom:8px;box-shadow:0 0 10px var(--ac)}
@media(max-width:639px){.grid .app:last-child:nth-child(odd){grid-column:1/-1;aspect-ratio:2/1.12}.grid .app:last-child:nth-child(odd) img{object-position:50% 36%}.grid .app:last-child:nth-child(odd) .tx b{font-size:23px}.grid .app:last-child:nth-child(odd) .tx span{font-size:12.5px}}
.app.soon{cursor:default}.app.soon img{filter:saturate(.35) brightness(.55)}
/* activity */
.card{padding:16px;border-radius:24px;background:linear-gradient(135deg,rgba(24,24,30,.92),rgba(12,12,15,.92));border:1px solid var(--ln)}
.ah{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.ah b{font:900 12px/1 -apple-system,sans-serif;letter-spacing:.22em}.ah span{font:900 9px/1 -apple-system,sans-serif;letter-spacing:.16em;color:var(--mut)}
.row{--ac:var(--grn);display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}
.row img{width:46px;height:46px;border-radius:13px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.08)}.row .nm{display:flex;justify-content:space-between;align-items:baseline;font:900 13px/1 -apple-system,sans-serif;letter-spacing:.03em}.row .nm em{font:800 9.5px/1 -apple-system,sans-serif;letter-spacing:.12em;font-style:normal;color:var(--mut)}
.row .ub{height:7px;border-radius:9px;background:var(--s2);margin-top:8px;overflow:hidden}.row .ub i{display:block;height:100%;border-radius:9px;background:var(--ac);box-shadow:0 0 10px var(--ac);transition:width .7s cubic-bezier(.2,.9,.3,1)}
.row .x{text-align:right;font:900 italic 18px/1 -apple-system,sans-serif}.row .x small{display:block;margin-top:3px;font:900 8.5px/1 -apple-system,sans-serif;letter-spacing:.18em;font-style:normal;color:var(--mut)}
.small{font:600 12.5px/1.45 -apple-system,sans-serif;color:var(--mut)}
/* sheet */
#sh{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(0,0,0,.66);backdrop-filter:blur(6px)}#sh.on{display:flex}
#shC{width:100%;max-width:520px;max-height:86vh;max-height:calc(100dvh - 40px);overflow:auto;margin:0 auto;padding:22px 18px calc(env(safe-area-inset-bottom) + 22px);border-radius:28px 28px 0 0;background:#0f0f13;border:1px solid var(--ln);animation:up .28s cubic-bezier(.2,.9,.3,1)}@keyframes up{from{transform:translateY(50px);opacity:0}}
.ey{font:900 10px/1 -apple-system,sans-serif;letter-spacing:.24em;color:var(--org)}.big{font:900 italic 27px/1.05 -apple-system,sans-serif;margin:8px 0}
input{width:100%;margin-top:12px;padding:15px;border-radius:15px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);font:700 17px -apple-system,sans-serif}
.go{width:100%;margin-top:12px;padding:17px;border-radius:17px;background:var(--rb);color:#000;font:900 italic 17px/1 -apple-system,sans-serif}.go:disabled{opacity:.5}.go.ghost{background:var(--s2);color:var(--tx);font-style:normal;font-size:12px;letter-spacing:.12em}
.err{min-height:18px;margin-top:8px;font:700 12.5px/1.3 -apple-system,sans-serif;color:var(--yel)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);z-index:30;padding:12px 17px;border-radius:999px;background:#fff;color:#000;font:900 11px/1 -apple-system,sans-serif;letter-spacing:.1em;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}#toast.on{opacity:1}
/* CR014: today's schedule + pro panel */
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}.ev:first-of-type{border-top:0}.ev time{font:900 italic 15px/1 -apple-system,sans-serif}.ev b{display:block;font:900 13px/1.2 -apple-system,sans-serif}.ev span{display:block;margin-top:3px;font:700 10.5px/1.3 -apple-system,sans-serif;color:var(--mut)}
.tg{padding:5px 8px;border-radius:999px;border:1px solid var(--ln);font:900 8px/1 -apple-system,sans-serif;letter-spacing:.14em;color:var(--mut);white-space:nowrap}.ev .tg{max-width:82px;white-space:normal;text-align:center;line-height:1.25;border-radius:10px;letter-spacing:.1em}.ev>div{min-width:0}.ev time{white-space:nowrap;min-width:62px}.ev b{overflow-wrap:anywhere}.tg.w{color:var(--yel);border-color:#5c4d12}.tg.g{color:var(--grn);border-color:#1c5a30}
.pp{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;width:100%;text-align:left}.pp img{width:64px;height:64px;border-radius:17px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 24px rgba(90,162,255,.25)}
.pn{font:900 italic 30px/1 -apple-system,sans-serif}.pn small{font:900 9px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.16em;color:var(--mut);margin-left:6px}.up{color:var(--grn)}.dn{color:var(--yel)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.kv div{padding:11px;border-radius:14px;background:var(--s2);border:1px solid var(--ln)}.kv span{display:block;font:900 8px/1.2 -apple-system,sans-serif;letter-spacing:.15em;color:var(--mut)}.kv b{display:block;margin-top:6px;font:900 italic 17px/1.1 -apple-system,sans-serif}.kv em{display:block;margin-top:3px;font:700 10.5px/1.25 -apple-system,sans-serif;font-style:normal;color:var(--mut)}
.seg{display:flex;gap:6px;margin:12px 0}.seg button{flex:1;padding:11px 4px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);font:900 9px/1 -apple-system,sans-serif;letter-spacing:.1em}.seg button.on{background:#5aa2ff;border-color:#5aa2ff;color:#000}
.card>.hr:first-child{border-top:0}.hr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--ln)}.hr b{font:900 13px/1.2 -apple-system,sans-serif}.hr span{display:block;font:700 10.5px/1.3 -apple-system,sans-serif;color:var(--mut)}.hr i{font:900 italic 16px/1 -apple-system,sans-serif}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:14px 0 0;font:900 9px/1.2 -apple-system,sans-serif;letter-spacing:.16em;color:var(--mut)}h3{margin:22px 0 4px;font:900 11px/1 -apple-system,sans-serif;letter-spacing:.22em}
.chips{display:flex;gap:6px;margin-top:8px}.chips button{flex:1;padding:12px 0;border-radius:12px;background:var(--s1);border:1px solid var(--ln);font:900 12px/1 -apple-system,sans-serif}.chips button.on{background:var(--org);border-color:var(--org);color:#000}
select{width:100%;margin-top:8px;padding:15px;border-radius:15px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);font:700 16px -apple-system,sans-serif}label+input{margin-top:8px}
button.ev{width:100%;text-align:left}.ev .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac,#888);margin-right:7px;box-shadow:0 0 8px var(--ac,#888)}
.dayh{margin:18px 0 2px;font:900 10px/1 -apple-system,sans-serif;letter-spacing:.2em;color:var(--org)}
.mx{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--ln)}.mx:first-of-type{border-top:0}.mx img{width:46px;height:46px;border-radius:13px;object-fit:cover}.mx b{display:block;font:900 13px/1.2 -apple-system,sans-serif}.mx span{display:block;margin-top:3px;font:700 10.5px/1.3 -apple-system,sans-serif;color:var(--mut)}.mx i{font:900 italic 17px/1 -apple-system,sans-serif;text-align:right}.mx i small{display:block;margin-top:3px;font:900 8px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.14em;color:var(--mut)}
.wk{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:10px}.wk div{flex:1;text-align:center;font:900 9px/1 -apple-system,sans-serif;color:var(--mut)}.wk u{display:block;margin:0 auto 6px;width:100%;border-radius:8px 8px 3px 3px;background:var(--ac,#5aa2ff);min-height:3px;text-decoration:none}.wk b{display:block;margin-bottom:4px;color:var(--tx);font-size:12px}
/* time + date boxes: iPhone gives these their own width and ignores ours, so two side by side ran into each other. Take the phone's styling off and let them shrink. */.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.two>div{min-width:0}input,select,textarea{display:block;box-sizing:border-box;min-width:0;max-width:100%}input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;height:54px;line-height:22px;text-align:left;overflow:hidden}input[type=time]::-webkit-date-and-time-value,input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:22px}input[type=checkbox]{display:inline-block}
textarea{width:100%;margin-top:8px;min-height:84px;padding:14px;border-radius:15px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);font:600 15px/1.4 -apple-system,sans-serif}.note{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--ln);font:600 13px/1.45 -apple-system,sans-serif;white-space:pre-wrap}.note span{display:block;margin-bottom:5px;font:900 8.5px/1 -apple-system,sans-serif;letter-spacing:.16em;color:var(--org)}
.pan{margin-top:12px;padding:14px;border-radius:16px;background:var(--s2);border:1px solid var(--ln)}.pan>span{display:block;margin-bottom:8px;font:900 9px/1 -apple-system,sans-serif;letter-spacing:.18em;color:var(--org)}.pan.ok{border-color:#1c5a30}.pan.ok>span{color:var(--grn)}.pan p{margin:0 0 7px;font:600 14px/1.45 -apple-system,sans-serif}.pan p:last-child{margin-bottom:0}.mt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mt div{padding:11px;border-radius:13px;background:var(--s1);border:1px solid var(--ln)}.mt span{display:block;font:900 8px/1.2 -apple-system,sans-serif;letter-spacing:.14em;color:var(--mut)}.mt b{display:block;margin-top:6px;font:900 italic 19px/1.1 -apple-system,sans-serif}.mt em{display:inline-block;margin-top:5px;padding:3px 6px;border-radius:6px;background:var(--grn);color:#000;font:900 8px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.1em}.xpl{display:flex;justify-content:space-between;padding:6px 0;font:800 13px/1.3 -apple-system,sans-serif}.xpl b{color:var(--grn)}
/* CR015: small app icons, schedule first, app links in the schedule */
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;margin:6px 0 4px}@media(min-width:640px){.agrid{grid-template-columns:repeat(6,1fr)}}
.ai{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--tx,#fff);text-align:center}
.ai img{width:60px;height:60px;border-radius:15px;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
.ai b{font:800 11px/1.2 -apple-system,sans-serif;letter-spacing:.01em;max-width:76px}
.ai.soon img,.ai.need img{opacity:.45;filter:grayscale(.6)}
.ai .as{position:absolute;top:-4px;right:6px;font:900 7px/1 -apple-system,sans-serif;letter-spacing:.1em;background:#222;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px 5px;font-style:normal}
.evw{border-top:1px solid var(--ln)}.evw:first-of-type{border-top:0}.evw .ev{border-top:0;padding-bottom:6px}

.allapps>span:first-child{flex:1}.allapps b{display:block;font:900 14px/1.2 -apple-system,sans-serif;letter-spacing:.14em}.allapps small{display:block;color:var(--mut,#999);font-size:12px;margin-top:3px}
.allapps .aimgs{display:flex}.allapps .aimgs img{width:30px;height:30px;border-radius:9px;object-fit:cover;margin-left:-8px;box-shadow:0 0 0 2px #111}.allapps i{font-style:normal;font-size:24px;color:var(--mut,#999)}
.back{display:inline-block;margin:6px 0 4px;padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:none;color:inherit;font:900 11px/1 -apple-system,sans-serif;letter-spacing:.14em}
.lvb{width:100%;text-align:left;color:inherit;border:0;font:inherit;position:relative;margin-top:6px}.lvb .lvgo{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:26px;color:var(--mut,#999)}
.pled .pl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.pled .pl:first-child{border-top:0}

/* ======================================================================

   static, I want telemetry, a dot, you hit the button and see everything move." One rule for every app, set once here:
     every day = 1% a session · 3 days a week = 2.5% · 2 days a week = 3% (the ceiling). The app does the math, people see one number.
   YOUR LINE: each finished session moves you up by its percent (compounding). THE 1% PATH: 1% a day, every day, from your first day.
   1% a day for a year = about 37x. Club Boss level = how many systems (apps) you ran this week.

const PCT_RULE=[[7,1],[6,1],[5,1.5],[4,2],[3,2.5],[2,3],[1,3]];

function planDays(app){const d=new Set();(S.evs||[]).forEach(r=>{if(r&&r.app===app&&r.data&&Array.isArray(r.data.days))r.data.days.forEach(x=>d.add(+x))});return d.size}

function bossData(now){now=now||Date.now();const rows=(S.rows||[]).filter(r=>r.kind==='session').map(r=>({app:r.app,t:+new Date(r.at)})).filter(r=>r.t<=now+6e4).sort((a,b)=>a.t-b.t);

 let start=day(rows[0].t);const minStart=day(now)-89*864e5;if(start<minStart)start=minStart;
 const nDays=Math.round((day(now)-start)/864e5)+1,pct={};APPS.forEach(a=>pct[a.id]=pctFor(perWeek(a.id,now)));
 const hit={};rows.forEach(r=>{if(r.t<start)return;const k=day(r.t)+'|'+r.app;hit[k]=r.app});
 const byDay={};Object.keys(hit).forEach(k=>{const d=+k.split('|')[0];(byDay[d]=byDay[d]||[]).push(hit[k])});
 /* each app keeps its own line (its sessions x its percent); YOU = the average of the apps you run. Hit your percent in every app
    and you ride the 1% path exactly - running more systems is what makes you Club Boss, not a bigger number. */
 const lines={};let you=1;const pts=[];
 for(let i=0;i<nDays;i++){const dd=new Date(start);dd.setDate(dd.getDate()+i);const d=dd.getTime();/* calendar days (DST-safe) */
  (byDay[d]||[]).forEach(a=>{lines[a]=(lines[a]||1)*(1+(pct[a]||1)/100)});
