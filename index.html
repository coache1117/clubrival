<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050605"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Biz Rival · BZ006</title>
<link rel="manifest" href="site.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#050605;--s1:#0e110f;--s2:#18201b;--ln:#223027;--tx:#f3f7f4;--mut:#8b978f;--g:#3d8bff;--g2:#8db8ff;--gold:#e8c96a;--red:#ff5a5f;--org:#ff9a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--tx);font:500 15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
body::before{content:'';position:fixed;inset:0 0 auto 0;height:420px;pointer-events:none;background:radial-gradient(60% 55% at 50% 0%,rgba(61,139,255,.18),rgba(232,201,106,.04) 45%,transparent 72%)}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;padding:0;cursor:pointer}
#sbar{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#050605;z-index:25;pointer-events:none}
main{position:relative;max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 44px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:50px;height:50px;border-radius:14px;box-shadow:0 0 24px rgba(61,139,255,.35),0 0 0 1px rgba(255,255,255,.08)}
.logo{white-space:nowrap;font:900 italic 26px/1 -apple-system,sans-serif}.logo b{color:var(--g)}
.ver{margin-top:6px;font:800 8.5px/1 -apple-system,sans-serif;letter-spacing:.2em;color:var(--mut)}
.clubback{display:inline-block;margin:0 0 10px;padding:8px 12px;border-radius:999px;border:1px solid var(--ln);font:900 11px/1 -apple-system,sans-serif;letter-spacing:.12em;color:inherit;text-decoration:none}
.pill{white-space:nowrap;padding:11px 14px;border-radius:999px;border:1px solid var(--ln);background:rgba(14,17,15,.8);font:900 11px/1 -apple-system,sans-serif;letter-spacing:.12em;min-height:40px}
.card{position:relative;margin:0 0 12px;padding:16px;border-radius:22px;border:1px solid var(--ln);background:linear-gradient(135deg,rgba(22,28,24,.95),rgba(9,11,10,.95))}
.ey{font:900 10px/1 -apple-system,sans-serif;letter-spacing:.2em;color:var(--mut)}.ey b{color:var(--g)}
.small{font:600 12.5px/1.45 -apple-system,sans-serif;color:var(--mut)}.small b{color:var(--tx)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:12px;border-radius:16px;background:var(--g);color:#03120a;font:900 14px/1 -apple-system,sans-serif;letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn.sm{min-height:44px;font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* today */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{--p:0;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc,var(--g)) calc(var(--p)*1%),#1c241f 0);transition:--p .8s}
.ring>div{width:84px;height:84px;border-radius:50%;background:#070908;display:grid;place-items:center;text-align:center}.ring b{font:900 italic 18px/1 -apple-system,sans-serif}.ring span{display:block;margin-top:3px;font:800 7.5px/1 -apple-system,sans-serif;letter-spacing:.14em;color:var(--mut)}
.big{font:900 italic 46px/1 -apple-system,sans-serif;letter-spacing:-.01em}.big.neg{color:var(--red)}
/* save */
.goal{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:10px 0 8px}.goal .big{font-size:34px}
.gbar{height:12px;border-radius:9px;background:#1c241f;overflow:hidden}.gbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#1fa85e,#5cf09a);transition:width .8s cubic-bezier(.2,.9,.2,1)}
.lvls{display:flex;gap:8px;margin-top:12px}.lvls button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--ln);font:900 13px/1 -apple-system,sans-serif}.lvls button.on{background:rgba(61,139,255,.14);border-color:var(--g);color:var(--g2)}.lvls button[disabled]{opacity:.45;cursor:default}.lvls small{display:block;margin-top:4px;font:800 8px/1 -apple-system,sans-serif;letter-spacing:.1em;color:var(--mut)}
/* graph */
.gnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0 4px}.gnums em{display:block;font:900 italic 20px/1 -apple-system,sans-serif;font-style:italic}.gnums em.pth{color:#7f8a83}.gnums small{display:block;margin-top:4px;font:800 8px/1 -apple-system,sans-serif;letter-spacing:.14em;color:var(--mut)}
svg.gr{display:block;width:100%;height:auto;overflow:visible}.gpath{fill:none;stroke:#56615a;stroke-width:2;stroke-dasharray:4 5}.gyou{fill:none;stroke:url(#mg);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.dcore{fill:#fff}.dring{fill:rgba(61,139,255,.25);stroke:var(--g);stroke-width:1.5;animation:pulse 1.6s ease-out infinite}@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion: reduce){.dring{animation:none}}
/* lists */
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--ln)}.li:first-of-type{border-top:0}
.li b{display:block;font:800 14px/1.25 -apple-system,sans-serif;overflow-wrap:anywhere}.li span{display:block;margin-top:2px;font:600 11.5px/1.3 -apple-system,sans-serif;color:var(--mut)}.li .amt{font:900 italic 16px/1 -apple-system,sans-serif}.amt.in{color:var(--g)}
.kc{display:flex;gap:6px}.kc button{min-width:56px;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--ln);font:900 11px/1 -apple-system,sans-serif;letter-spacing:.06em}.kc button.on.k{border-color:var(--g);color:var(--g2)}.kc button.on.c{border-color:var(--red);color:var(--red)}
.tag{display:inline-block;padding:4px 8px;border-radius:99px;border:1px solid var(--ln);font:900 9px/1 -apple-system,sans-serif;letter-spacing:.12em;color:var(--mut)}.tag.g{border-color:var(--g);color:var(--g2)}.tag.s{border-color:var(--gold);color:var(--gold)}
/* sheet */
.sh{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}.sh>div{width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);border-radius:24px 24px 0 0;background:#0d110e;border:1px solid var(--ln)}
.sh h2{margin:0 0 6px;font:900 italic 22px/1.15 -apple-system,sans-serif}
label{display:block;margin:12px 0 0;font:800 10px/1 -apple-system,sans-serif;letter-spacing:.16em;color:var(--mut)}
input[type=text],input[type=number],input[type=email]{display:block;width:100%;margin-top:7px;min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--ln);background:#070908;font-size:18px;font-weight:800}
.money{position:relative}.money::before{content:'$';position:absolute;left:14px;bottom:15px;font-weight:900;color:var(--mut)}.money input{padding-left:28px}
.err{color:var(--red);font:700 12.5px/1.4 -apple-system,sans-serif;min-height:1em;margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:50;padding:13px 18px;border-radius:14px;background:#e9f7ef;color:#062014;font:800 13px/1.3 -apple-system,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.priv{display:flex;gap:8px;align-items:flex-start;margin:4px 2px 0;font:700 11px/1.4 -apple-system,sans-serif;color:#6e7a72}
.nsp{margin-top:12px;padding-top:11px;border-top:1px solid var(--ln);font:700 12.5px/1.4 -apple-system,sans-serif;color:var(--mut)}.nsp b{color:var(--tx)}.nsp .g2{color:var(--g2)}
.mv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--ln)}.mv:first-of-type{border-top:0}.mv b{display:block;font:800 14px/1.25 -apple-system,sans-serif}.mv span{display:block;margin-top:2px;font:600 11.5px/1.35 -apple-system,sans-serif;color:var(--mut)}.mv span b{display:inline;color:var(--tx)}.mv.bill b{color:var(--org)}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--g2)}

/* MO004 - LIGHT MODE. Follows the phone (AUTO), or LIGHT / DARK from ACCOUNT. Same switch as Club Rival. */
html[data-theme="light"]{--bg:#f3f6f4;--s1:#ffffff;--s2:#e9efeb;--ln:#d6e0d9;--tx:#101512;--mut:#56645b;--g:#1f5fd1;--g2:#174aa6;--gold:#9a7a12;--red:#d4202a;--org:#b85a00;color-scheme:light}
html[data-theme="light"] body::before{background:radial-gradient(60% 55% at 50% 0%,rgba(61,139,255,.14),rgba(232,201,106,.05) 45%,transparent 72%)}
html[data-theme="light"] #sbar{background:#f3f6f4}
html[data-theme="light"] .brand img{box-shadow:0 6px 18px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.06)}
html[data-theme="light"] .pill{background:rgba(255,255,255,.9)}
html[data-theme="light"] .card{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,40,30,.06)}
html[data-theme="light"] .ring{background:conic-gradient(var(--rc,var(--g)) calc(var(--p)*1%),#e1e8e3 0)}
html[data-theme="light"] .ring>div{background:#fff}
html[data-theme="light"] .gbar,html[data-theme="light"] .ring::before{background:#e1e8e3}
html[data-theme="light"] .btn{color:#fff}html[data-theme="light"] .btn.ghost{color:var(--tx)}
html[data-theme="light"] .gpath{stroke:#a3b0a8}html[data-theme="light"] .dcore{fill:#101512}
html[data-theme="light"] .gnums em.pth{color:#6d7a72}
html[data-theme="light"] .sh{background:rgba(10,20,15,.35)}html[data-theme="light"] .sh>div{background:#fbfdfc;box-shadow:0 -10px 40px rgba(0,0,0,.12)}
html[data-theme="light"] input[type=text],html[data-theme="light"] input[type=number],html[data-theme="light"] input[type=email]{background:#fff}
html[data-theme="light"] .toast{background:#101512;color:#fff}
html[data-theme="light"] .priv{color:#56645b}
html[data-theme="light"] .lvls button.on{background:rgba(31,95,209,.1)}
.thm{display:flex;gap:8px;margin-top:8px}.thm button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);font:900 11px/1 -apple-system,sans-serif;letter-spacing:.12em;cursor:pointer}.thm button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.kinds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.kinds .btn{width:auto;margin:0;flex:1 1 45%}
.hz{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:10px}.hz button{height:40px;border-radius:12px;border:1px solid var(--ln);background:transparent;color:var(--tx);font:900 10px/1 -apple-system,sans-serif;letter-spacing:.12em}.hz button.on{background:var(--g);border-color:var(--g);color:#ffffff}
.fc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 8px}.fc.two{grid-template-columns:1fr 1fr}.fc>div{border:1px solid var(--ln);border-radius:14px;padding:10px}.fc span{display:block;font:900 9px/1 -apple-system,sans-serif;letter-spacing:.14em;color:var(--mut)}.fc b{display:block;font:900 20px/1.2 -apple-system,sans-serif;margin-top:6px;color:var(--tx)}.fc b.neg{color:var(--red)}.fc em{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two>div{min-width:0}
.ck{display:flex;align-items:center;gap:8px;margin-top:10px;font:800 11px/1 -apple-system,sans-serif;letter-spacing:.1em}.ck input{width:auto;height:auto}
input[type=date],select{display:block;width:100%;margin-top:7px;min-height:50px;padding:0 12px;border-radius:14px;border:1px solid var(--ln);background:#070908;font-size:16px;font-weight:800;-webkit-appearance:none;appearance:none}html[data-theme="light"] input[type=date],html[data-theme="light"] select{background:#fff}
.mode{margin:-4px 0 10px;padding:9px 12px;border-radius:12px;border:1px dashed var(--gold);color:var(--gold);font:900 10px/1.3 -apple-system,sans-serif;letter-spacing:.12em;text-align:center}.mode.live{border:1px solid var(--g);color:var(--g2)}
.warn{margin:0 0 10px;color:var(--org)}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:0 0 12px;padding:6px;border-radius:16px;border:1px solid var(--ln);background:var(--s1)}
.tabs button{height:38px;border-radius:11px;font:900 10px/1 -apple-system,sans-serif;letter-spacing:.1em;color:var(--mut)}.tabs button.on{background:var(--g);color:#fff}.tabs i{display:inline-block;min-width:16px;padding:2px 4px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:9px}
button.li.tl{width:100%;text-align:left;color:inherit}
.k{font-style:normal;font:900 8px/1 -apple-system,sans-serif;letter-spacing:.12em;padding:5px 7px;border-radius:99px;border:1px solid var(--ln);color:var(--mut);white-space:nowrap}.k.lead{border-color:var(--g);color:var(--g2)}.k.billing{border-color:var(--red);color:var(--red)}.k.scheduling{border-color:var(--gold);color:var(--gold)}
.why{margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(255,154,61,.12);border:1px solid var(--org);font-weight:700;font-size:13.5px}
.msgs{margin-top:10px;max-height:40vh;overflow:auto}.msg{margin:8px 0;padding:10px 12px;border-radius:14px;border:1px solid var(--ln)}.msg.out{margin-left:24px;border-color:var(--g)}.msg span{display:block;font:900 9px/1 -apple-system,sans-serif;letter-spacing:.12em;color:var(--mut)}.msg p{margin:6px 0 0;white-space:pre-wrap;font-size:14px}
textarea{display:block;width:100%;margin-top:7px;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:500 14px/1.45 -apple-system,sans-serif;resize:vertical}
.job{padding:12px 0;border-top:1px solid var(--ln)}.job b{display:block;font-size:14px}.lv3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.lv3 button,.thm button{height:38px;border-radius:11px;border:1px solid var(--ln);font:900 10px/1 -apple-system,sans-serif;letter-spacing:.1em}.lv3 button.on{background:var(--g);border-color:var(--g);color:#fff}
.job select{display:inline-block;width:auto;min-height:0;height:32px;margin:0 4px;padding:0 8px}
.hr{display:flex;align-items:center;gap:8px;margin-top:8px}.hr .day{width:58px;height:40px;border-radius:11px;border:1px solid var(--ln);font:900 10px/1 -apple-system,sans-serif;letter-spacing:.1em;color:var(--mut)}.hr .day.on{background:var(--g);border-color:var(--g);color:#fff}.hr input{flex:1;min-width:0;margin:0}.hr span{font-size:12px;color:var(--mut)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.three input{min-width:0}
details.ob{padding:10px 0;border-top:1px solid var(--ln)}details.ob summary{font-size:13px;cursor:pointer}details.ob p{white-space:pre-wrap;font-size:13px;color:var(--mut)}
input[type=time]{display:block;width:100%;min-height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font-weight:800}
/* OR001 - room under the last button so the Orb never covers it */
#m{padding-bottom:calc(env(safe-area-inset-bottom) + 230px)!important}
</style>
<script src="lib/supabase.js"></script>
<script>/* BZ001 theme: AUTO follows the phone; LIGHT / DARK from ACCOUNT. Runs before the page paints. */
(function(){function pref(){try{return localStorage.getItem('bz_theme')||'auto'}catch(e){return 'auto'}}var mq=window.matchMedia&&matchMedia('(prefers-color-scheme: light)');
 window.bzTheme=function(p){if(p){try{localStorage.setItem('bz_theme',p)}catch(e){}}p=pref();var t=p==='auto'?(mq&&mq.matches?'light':'dark'):p;document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#f3f6f4':'#050605');return p};
 window.bzTheme();if(mq&&mq.addEventListener)mq.addEventListener('change',function(){window.bzTheme()})})();</script>
</head>
<body><div id="sbar"></div><main id="m"></main>

<!-- KIT · the Orb and the voice load from Club Rival (one upload there updates every app). The copy here is only a backup. -->
<script src="https://clubrival.netlify.app/kit/rival-orb.js" data-app="biz" defer onerror="var s=document.createElement('script');s.src='rival-orb.js';s.setAttribute('data-app','biz');document.head.appendChild(s)"></script>
<script src="https://clubrival.netlify.app/kit/rival-voice.js" defer onerror="var s=document.createElement('script');s.src='rival-voice.js';document.head.appendChild(s)"></script>
<script>/* BZ004 · words for the mic: "Coach, let's work" · "Coach, next" · "Coach, done today". Anything else: say the words on a button. */
window.RV_COMMANDS=function(said,h){var s=h.norm(said);function hit(res){var bs=[].slice.call(document.querySelectorAll('button,a[href],[role=button]')).filter(function(e){var r=e.getBoundingClientRect();return r.width&&e.offsetParent!==null});for(var i=0;i<res.length;i++)for(var j=0;j<bs.length;j++){var L=h.norm((bs[j].getAttribute('aria-label')||bs[j].innerText||'').split('\n')[0]);if(res[i].test(L)){bs[j].click();return L.charAt(0).toUpperCase()+L.slice(1)+'.'}}return false}
 if(/^(lets work|start( my)? (day|work)|lets go)$/.test(s))return hit([/^lets work/]);
 return false};
</script>
